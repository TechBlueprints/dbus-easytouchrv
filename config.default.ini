[DEFAULT]
# EasyTouch RV Thermostat Configuration

# NOTE: connection mode and poll interval can also be changed at runtime
# from the GUI ("<name> setup" card in the switch pane).  GUI changes are
# persisted in localsettings and override the defaults below.

# Connection model:
#   persistent (default) - hold a BLE connection to each thermostat, polling
#       status every poll_seconds.  Near-real-time temps and instant control,
#       matching the vendor app's own connection model.  Note: a thermostat
#       only accepts one BLE central, so the phone app cannot connect over
#       Bluetooth while the driver is attached (the app still works through
#       the vendor cloud when the unit is on Wi-Fi).
#   intermittent - connect, read, and disconnect each poll interval,
#       leaving the BLE link free for the phone app between polls.
#       ("transient" is accepted as a synonym.)
connection = persistent

# Persistent mode: status poll cadence over the held connection (seconds).
poll_seconds = 10

# How often to read the model-specific diagnostics block (coil temperatures,
# relay/cycle flags), in seconds.
diagnostics_seconds = 60

# Intermittent mode only: minutes between connect-read-disconnect sessions.
# Control changes reconnect immediately regardless.
poll_interval_minutes = 5

# Mirror the unit's FREEZE DETECTED fault onto a virtual digital input so it
# reaches VRM's alarm log.  Venus only ships whitelisted paths to VRM, and a
# temperature service's alarms are not among them; a digital input's /Alarm
# is.  Set to false to skip creating the extra device.
freeze_alarm_input = true

# Where the shared bleak-connection-manager install lives on this box.
# This is the ONLY thing that decides where the BLE stack comes from: the
# service execs a plain python3 and sources the folder in process, so no
# interpreter shim, PYTHONPATH or environment variable participates.
# Present means <dir>/src/bleak_connection_manager exists; an EMPTY value
# means never look, and the service then runs uncoordinated on plain
# bleak-retry-connector (no claims, no adapter routing, no card recovery).
# Point this at a second checkout to canary a BCM revision on one service.
bluetooth_connection_manager_dir = /data/bcm

# Force StartNotify for every start_notify in this process.  Per-process
# policy, passed to the catcher; there is no central BCM config file.
bluetooth_connection_manager_force_start_notify = true

# Bluetooth adapter selection (bleak-connection-manager v2).  Entries are
# separated by commas or spaces and passed to the catcher verbatim:
#   hciX             adds that adapter to the shared pool for all devices
#   MAC@hciX         pins that thermostat to that adapter (repeat the MAC
#                    for an ordered preference list; pinned devices never
#                    fall back to the pool)
# Leave empty (default) to let every adapter the kernel exposes be a
# candidate; connections then spread by live cross-process occupancy.
#adapters = hci0 hci1

# Optional per-adapter established-link caps, "hciX:N" entries.  Dongle
# limits are undocumented, so caps are deployment config (CSR dongles
# handle ~5 links, Broadcom ~7).  An uncapped adapter is never gated.
#link_caps = hci0:5

# Optional default passcode written to every thermostat after connecting.
# Leave blank if your controllers do not require a passcode.  A per-device
# 'passcode' in a device section overrides this.
passcode =

# ─────────────────────────────────────────────────────────────────────────────
# Per-thermostat configuration
# ─────────────────────────────────────────────────────────────────────────────
# Add one section per thermostat.  Run provision.py to generate these
# automatically from a BLE scan, or add them by hand.
#
# The 'mac' field must be the BLE advertisement MAC address (visible in a BLE
# scanner app or via: python3 easytouch_device.py --scan).
#
# The optional 'serial' is the 9-digit serial from the BLE advertised name
# (e.g. "EasyTouch 352123456" -> 352123456).  Its first three digits select
# the A/C-model-specific diagnostics decoder (coil temperatures, gas/electric
# heat state).  When omitted, the driver learns it from the BLE name on the
# first connection.
#
# Example:
#
# [Bedroom_AC]
# name = Bedroom A/C
# mac = AA:BB:CC:DD:EE:FF
# zone = 0
# serial = 352123456
# passcode =
